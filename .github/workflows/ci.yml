name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_PYTHON: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
